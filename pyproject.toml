[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurolabs"
version = "0.1.0"
description = "A local laboratory for inspecting and editing neural networks"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "torch>=2.6,<3",
  "safetensors>=0.5,<1",
  "numpy>=2,<3",
  "onnx>=1.21,<2",
  "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "onnxscript>=0.5,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/neurolabs"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
